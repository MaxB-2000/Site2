<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2b1a06"/>
      <stop offset="100%" stop-color="#0f0800"/>
    </radialGradient>
    <radialGradient id="body" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#e8c96a"/>
      <stop offset="55%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#7a5a18"/>
    </radialGradient>
    <radialGradient id="shine" cx="42%" cy="36%" r="42%">
      <stop offset="0%" stop-color="#fff8e1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
