  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>

  <!-- tentacles -->
  <path d="M21 36 Q18 44 20 52 Q22 58 19 63" stroke="#c9a84c" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.75"/>
  <path d="M27 38 Q25 47 26 54 Q27 60 24 64" stroke="#c9a84c" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M32 39 Q32 48 32 56 Q32 61 32 64" stroke="#e8c96a" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M37 38 Q39 47 38 54 Q37 60 40 64" stroke="#c9a84c" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M43 36 Q46 44 44 52 Q42 58 45 63" stroke="#c9a84c" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.75"/>

  <!-- bell -->
  <ellipse cx="32" cy="26" rx="17" ry="15" fill="url(#body)"/>
  <ellipse cx="30" cy="22" rx="12" ry="9" fill="url(#shine)"/>

  <!-- eyes -->
  <ellipse cx="27" cy="28" rx="3" ry="3.5" fill="#2b1a06"/>
  <ellipse cx="37" cy="28" rx="3" ry="3.5" fill="#2b1a06"/>
  <circle cx="27.8" cy="27.2" r="1.3" fill="#c9a84c"/>
  <circle cx="37.8" cy="27.2" r="1.3" fill="#c9a84c"/>
  <circle cx="28.4" cy="26.6" r="0.6" fill="#fff8e1"/>
  <circle cx="38.4" cy="26.6" r="0.6" fill="#fff8e1"/>

  <!-- smile -->
  <path d="M28.5 32 Q32 36 35.5 32" stroke="#fff8e1" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- bubbles -->
  <circle cx="12" cy="18" r="1.5" fill="none" stroke="#a07830" stroke-width="0.8" opacity="0.6"/>
  <circle cx="52" cy="14" r="2" fill="none" stroke="#a07830" stroke-width="0.8" opacity="0.5"/>
